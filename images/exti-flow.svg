<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="Consolas, 'Courier New', monospace" font-size="13">
  <defs>
    <marker id="arr4" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <style>
      .stage { fill: #e8f0fe; stroke: #4a7abc; stroke-width: 1.5; rx: 8; }
      .stage2 { fill: #fff3e0; stroke: #e8833a; stroke-width: 1.5; rx: 8; }
      .stage3 { fill: #e8f5e9; stroke: #4caf50; stroke-width: 1.5; rx: 8; }
      .stage4 { fill: #fce4ec; stroke: #c62828; stroke-width: 1.5; rx: 8; }
      .lbl { fill: #222; font-size: 13px; text-anchor: middle; }
      .sub { fill: #555; font-size: 11px; text-anchor: middle; }
      .ln { stroke: #333; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <text x="410" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">EXTI → NVIC → ISR 中断响应流程</text>

  <!-- Step 1: External event -->
  <rect x="260" y="55" width="300" height="60" class="stage4"/>
  <text x="410" y="80" class="lbl" font-weight="bold">① 外部事件触发</text>
  <text x="410" y="100" class="sub">按键按下 → GPIO 引脚电平变化</text>

  <line x1="410" y1="115" x2="410" y2="140" class="ln" marker-end="url(#arr4)"/>

  <!-- Step 2: EXTI edge detection -->
  <rect x="200" y="140" width="420" height="80" class="stage2"/>
  <text x="410" y="165" class="lbl" font-weight="bold">② EXTI 外部中断控制器（边沿检测）</text>
  <text x="410" y="185" class="sub">配置触发方式：上升沿（Rising）或 下降沿（Falling）</text>
  <text x="410" y="203" class="sub">EXTI Line x 检测到匹配边沿 → 挂起中断标志位（Pending Bit）</text>

  <line x1="410" y1="220" x2="410" y2="245" class="ln" marker-end="url(#arr4)"/>

  <!-- Step 3: NVIC -->
  <rect x="200" y="245" width="420" height="80" class="stage3"/>
  <text x="410" y="270" class="lbl" font-weight="bold">③ NVIC 嵌套向量中断控制器</text>
  <text x="410" y="290" class="sub">判断中断优先级（抢占优先级 + 子优先级）</text>
  <text x="410" y="308" class="sub">若当前无更高优先级中断 → 响应此中断，跳转到对应 ISR</text>

  <line x1="410" y1="325" x2="410" y2="350" class="ln" marker-end="url(#arr4)"/>

  <!-- Step 4: ISR -->
  <rect x="160" y="350" width="500" height="90" class="stage"/>
  <text x="410" y="375" class="lbl" font-weight="bold">④ 中断服务函数 ISR</text>
  <text x="410" y="395" class="sub">HAL_GPIO_EXTI_IRQHandler(GPIO_PIN_x) → 清中断标志</text>
  <text x="410" y="413" class="sub">→ HAL_GPIO_EXTI_Callback(GPIO_Pin)  ← 用户回调函数</text>
  <text x="410" y="431" class="sub" fill="#c62828" font-weight="bold">在 Callback 中写：按键翻转 LED / 发送消息 / ...</text>

  <line x1="410" y1="440" x2="410" y2="465" class="ln" marker-end="url(#arr4)"/>

  <!-- Step 5: Return -->
  <rect x="260" y="465" width="300" height="50" class="stage"/>
  <text x="410" y="495" class="lbl" font-weight="bold">⑤ 中断返回，继续主循环</text>

  <!-- Side note: debounce -->
  <rect x="50" y="140" width="130" height="80" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="6"/>
  <text x="115" y="162" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">EXTI 配置要点</text>
  <text x="115" y="180" text-anchor="middle" font-size="10" fill="#888">CubeMX 中 GPIO 模式选</text>
  <text x="115" y="195" text-anchor="middle" font-size="10" fill="#888">GPIO_EXTI11 等</text>
  <text x="115" y="210" text-anchor="middle" font-size="10" fill="#888">触发沿 Rising/Falling</text>

  <!-- Side note: priority -->
  <rect x="660" y="245" width="130" height="80" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="6"/>
  <text x="725" y="267" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">NVIC 优先级</text>
  <text x="725" y="285" text-anchor="middle" font-size="10" fill="#888">抢占优先级（0~15）</text>
  <text x="725" y="300" text-anchor="middle" font-size="10" fill="#888">数字越小优先级越高</text>
  <text x="725" y="315" text-anchor="middle" font-size="10" fill="#888">分组：NVIC_PRIORITYGROUP</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, sans-serif">
  <text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold">FreeRTOS 多任务调度示意</text>

  <!-- Timeline axis -->
  <line x1="60" y1="380" x2="760" y2="380" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#333"/></marker></defs>
  <text x="770" y="385" font-size="12" fill="#333">时间</text>

  <!-- Task 1 row -->
  <text x="55" y="100" text-anchor="end" font-size="13" font-weight="bold" fill="#2980b9">Task_LED</text>
  <text x="55" y="116" text-anchor="end" font-size="10" fill="#7f8c8d">优先级 Normal</text>
  <!-- Running blocks -->
  <rect x="80" y="85" width="100" height="30" fill="#2980b9" rx="2"/>
  <text x="130" y="105" text-anchor="middle" font-size="10" fill="white">运行</text>
  <!-- Blocked -->
  <rect x="180" y="85" width="120" height="30" fill="#ecf0f1" stroke="#bdc3c7" stroke-dasharray="4,2" rx="2"/>
  <text x="240" y="105" text-anchor="middle" font-size="10" fill="#95a5a6">阻塞(延时)</text>
  <!-- Running -->
  <rect x="300" y="85" width="100" height="30" fill="#2980b9" rx="2"/>
  <text x="350" y="105" text-anchor="middle" font-size="10" fill="white">运行</text>
  <!-- Blocked -->
  <rect x="400" y="85" width="120" height="30" fill="#ecf0f1" stroke="#bdc3c7" stroke-dasharray="4,2" rx="2"/>
  <text x="460" y="105" text-anchor="middle" font-size="10" fill="#95a5a6">阻塞(延时)</text>
  <!-- Running -->
  <rect x="520" y="85" width="100" height="30" fill="#2980b9" rx="2"/>
  <text x="570" y="105" text-anchor="middle" font-size="10" fill="white">运行</text>

  <!-- Task 2 row -->
  <text x="55" y="180" text-anchor="end" font-size="13" font-weight="bold" fill="#27ae60">Task_Print</text>
  <text x="55" y="196" text-anchor="end" font-size="10" fill="#7f8c8d">优先级 Normal</text>
  <!-- Blocked waiting queue -->
  <rect x="80" y="165" width="200" height="30" fill="#ecf0f1" stroke="#bdc3c7" stroke-dasharray="4,2" rx="2"/>
  <text x="180" y="185" text-anchor="middle" font-size="10" fill="#95a5a6">阻塞(等队列消息)</text>
  <!-- Running (woken by queue) -->
  <rect x="280" y="165" width="60" height="30" fill="#27ae60" rx="2"/>
  <text x="310" y="185" text-anchor="middle" font-size="10" fill="white">运行</text>
  <!-- Blocked -->
  <rect x="340" y="165" width="200" height="30" fill="#ecf0f1" stroke="#bdc3c7" stroke-dasharray="4,2" rx="2"/>
  <text x="440" y="185" text-anchor="middle" font-size="10" fill="#95a5a6">阻塞(等队列消息)</text>
  <!-- Running -->
  <rect x="540" y="165" width="60" height="30" fill="#27ae60" rx="2"/>
  <text x="570" y="185" text-anchor="middle" font-size="10" fill="white">运行</text>

  <!-- Idle task row -->
  <text x="55" y="260" text-anchor="end" font-size="13" font-weight="bold" fill="#95a5a6">Idle Task</text>
  <text x="55" y="276" text-anchor="end" font-size="10" fill="#7f8c8d">最低优先级</text>
  <rect x="80" y="245" width="0" height="30" fill="#95a5a6"/>
  <rect x="180" y="245" width="120" height="30" fill="#bdc3c7" rx="2"/>
  <text x="240" y="265" text-anchor="middle" font-size="10" fill="white">运行(空闲)</text>
  <rect x="380" y="245" width="140" height="30" fill="#bdc3c7" rx="2"/>
  <text x="450" y="265" text-anchor="middle" font-size="10" fill="white">运行(空闲)</text>

  <!-- Queue arrow -->
  <path d="M300,115 L300,165" stroke="#f39c12" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrO)"/>
  <defs><marker id="arrO" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f39c12"/></marker></defs>
  <text x="310" y="145" font-size="10" fill="#f39c12" font-weight="bold">队列通知</text>

  <path d="M540,115 L540,165" stroke="#f39c12" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrO)"/>
  <text x="550" y="145" font-size="10" fill="#f39c12" font-weight="bold">队列通知</text>

  <!-- Scheduler box -->
  <rect x="200" y="310" width="400" height="50" rx="8" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
  <text x="400" y="332" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">FreeRTOS 调度器 (Scheduler)</text>
  <text x="400" y="350" text-anchor="middle" font-size="11" fill="#c0392b">抢占式：高优先级就绪立即抢占｜同优先级：时间片轮转</text>

  <!-- Legend -->
  <rect x="80" y="400" width="15" height="12" fill="#2980b9" rx="1"/>
  <text x="100" y="410" font-size="11" fill="#333">运行(Running)</text>
  <rect x="220" y="400" width="15" height="12" fill="#ecf0f1" stroke="#bdc3c7" stroke-dasharray="3,1" rx="1"/>
  <text x="240" y="410" font-size="11" fill="#333">阻塞/就绪(Blocked/Ready)</text>
  <line x1="400" y1="406" x2="420" y2="406" stroke="#f39c12" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="425" y="410" font-size="11" fill="#333">队列通信</text>
</svg>

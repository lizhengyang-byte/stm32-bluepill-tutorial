<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Consolas, 'Courier New', monospace">
  <style>
    .title { font-size: 18px; font-weight: bold; fill: #222; }
    .subtitle { font-size: 12px; fill: #555; }
    .panel-title { font-size: 14px; font-weight: bold; }
    .wire { stroke: #333; stroke-width: 2; fill: none; }
    .wire-active { stroke: #e74c3c; stroke-width: 2.5; fill: none; }
    .resistor { fill: #f5e6c8; stroke: #b8860b; stroke-width: 1.5; }
    .led { fill: #ff6b6b; stroke: #c0392b; stroke-width: 1.5; }
    .pin-box { fill: #1a5fb4; stroke: #0d3a6b; stroke-width: 1.5; rx: 4; }
    .pin-text { font-size: 12px; fill: #fff; font-weight: bold; }
    .label { font-size: 12px; fill: #333; }
    .label-bold { font-size: 13px; fill: #222; font-weight: bold; }
    .voltage-label { font-size: 13px; fill: #e67e22; font-weight: bold; }
    .gnd-symbol { stroke: #333; stroke-width: 2; }
    .current-arrow { stroke: #e74c3c; stroke-width: 1.5; fill: #e74c3c; }
  </style>

  <text x="450" y="28" text-anchor="middle" class="title">LED 两种接线方式对比</text>
  <text x="450" y="48" text-anchor="middle" class="subtitle">板载 PC13（低电平点亮） vs 外接 PB0（高电平点亮）</text>

  <!-- ===== LEFT PANEL: Onboard PC13 LED (low level lights) ===== -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="400" height="380" fill="#f8f9fa" stroke="#dee2e6" rx="8"/>
    <text x="200" y="25" text-anchor="middle" class="panel-title" fill="#c0392b">板载 LED（PC13）— 低电平点亮</text>
    <text x="200" y="42" text-anchor="middle" font-size="11" fill="#666">灌电流接法：电源 → LED → 电阻 → 引脚</text>

    <!-- 3.3V source at top -->
    <line x1="200" y1="70" x2="200" y2="90" class="wire"/>
    <text x="200" y="65" text-anchor="middle" class="voltage-label">+3.3V</text>
    <line x1="170" y1="70" x2="230" y2="70" class="gnd-symbol"/>

    <!-- LED -->
    <circle cx="200" cy="115" r="18" class="led"/>
    <text x="200" y="120" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">LED</text>
    <!-- LED triangle indicator -->
    <polygon points="215,108 225,115 215,122" fill="#c0392b"/>
    <line x1="225" y1="105" x2="225" y2="125" stroke="#c0392b" stroke-width="1.5"/>

    <line x1="200" y1="133" x2="200" y2="160" class="wire"/>

    <!-- Resistor 220Ω -->
    <rect x="175" y="160" width="50" height="25" class="resistor"/>
    <text x="200" y="177" text-anchor="middle" font-size="11" fill="#664d03" font-weight="bold">220Ω</text>

    <line x1="200" y1="185" x2="200" y2="230" class="wire"/>

    <!-- PC13 pin -->
    <rect x="150" y="230" width="100" height="35" class="pin-box"/>
    <text x="200" y="252" text-anchor="middle" class="pin-text">PC13</text>

    <!-- Current direction arrow (when lit: 3.3V → LED → R → PC13) -->
    <g transform="translate(260, 100)">
      <line x1="0" y1="0" x2="0" y2="130" class="current-arrow" stroke-dasharray="0"/>
      <polygon points="-4,125 4,125 0,135" class="current-arrow"/>
      <text x="10" y="70" font-size="10" fill="#e74c3c">电流方向</text>
    </g>

    <!-- Result box -->
    <rect x="40" y="290" width="320" height="70" fill="#ffeaa7" stroke="#fdcb6e" rx="5"/>
    <text x="200" y="312" text-anchor="middle" class="label-bold" fill="#d35400">PC13 = 低电平 (0V) → LED 亮</text>
    <text x="200" y="332" text-anchor="middle" class="label" fill="#666">GPIO_PIN_RESET</text>
    <text x="200" y="350" text-anchor="middle" class="label" fill="#999">PC13 = 高电平 (3.3V) → 两端等压 → LED 灭</text>
  </g>

  <!-- ===== RIGHT PANEL: External PB0 LED (high level lights) ===== -->
  <g transform="translate(470, 80)">
    <rect x="0" y="0" width="400" height="380" fill="#f8f9fa" stroke="#dee2e6" rx="8"/>
    <text x="200" y="25" text-anchor="middle" class="panel-title" fill="#27ae60">外接 LED（PB0）— 高电平点亮</text>
    <text x="200" y="42" text-anchor="middle" font-size="11" fill="#666">拉电流接法：引脚 → 电阻 → LED → GND</text>

    <!-- PB0 pin at top -->
    <rect x="150" y="65" width="100" height="35" class="pin-box"/>
    <text x="200" y="87" text-anchor="middle" class="pin-text">PB0</text>

    <line x1="200" y1="100" x2="200" y2="130" class="wire"/>

    <!-- Resistor 220Ω -->
    <rect x="175" y="130" width="50" height="25" class="resistor"/>
    <text x="200" y="147" text-anchor="middle" font-size="11" fill="#664d03" font-weight="bold">220Ω</text>

    <line x1="200" y1="155" x2="200" y2="185" class="wire"/>

    <!-- LED -->
    <circle cx="200" cy="210" r="18" class="led"/>
    <text x="200" y="215" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">LED</text>
    <!-- LED triangle pointing down (anode up) -->
    <polygon points="193,203 207,203 200,193" fill="#c0392b"/>
    <line x1="190" y1="200" x2="210" y2="200" stroke="#c0392b" stroke-width="1.5"/>

    <line x1="200" y1="228" x2="200" y2="260" class="wire"/>

    <!-- GND symbol -->
    <line x1="175" y1="260" x2="225" y2="260" class="gnd-symbol"/>
    <line x1="183" y1="268" x2="217" y2="268" class="gnd-symbol"/>
    <line x1="191" y1="276" x2="209" y2="276" class="gnd-symbol"/>
    <text x="200" y="295" text-anchor="middle" class="voltage-label" fill="#555">GND (0V)</text>

    <!-- Current direction arrow -->
    <g transform="translate(260, 105)">
      <line x1="0" y1="0" x2="0" y2="155" class="current-arrow"/>
      <polygon points="-4,150 4,150 0,160" class="current-arrow"/>
      <text x="10" y="80" font-size="10" fill="#e74c3c">电流方向</text>
    </g>

    <!-- Result box -->
    <rect x="40" y="310" width="320" height="55" fill="#dfe6e9" stroke="#b2bec3" rx="5"/>
    <text x="200" y="332" text-anchor="middle" class="label-bold" fill="#27ae60">PB0 = 高电平 (3.3V) → LED 亮</text>
    <text x="200" y="352" text-anchor="middle" class="label" fill="#666">GPIO_PIN_SET</text>
  </g>

  <!-- Bottom tip -->
  <text x="450" y="485" text-anchor="middle" font-size="11" fill="#666">
    💡 判断口诀：LED 正极接电源、负极接引脚 → 低电平亮；LED 正极接引脚、负极接 GND → 高电平亮
  </text>
</svg>

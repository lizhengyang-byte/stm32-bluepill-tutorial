<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Helvetica,Arial,sans-serif" font-size="13">
  <rect width="760" height="380" fill="#fafbfc"/>
  <text x="380" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">三种最常见的 ADC 前端分压接法</text>

  <!-- 1. potentiometer -->
  <g transform="translate(40,50)">
    <text x="0" y="0" font-weight="bold" fill="#1a4a78">① 电位器（可调参考电压）</text>
    <line x1="40" y1="20" x2="40" y2="120" stroke="#333" stroke-width="2"/>
    <text x="40" y="14" text-anchor="middle" font-size="11">3.3V</text>
    <rect x="25" y="40" width="30" height="60" fill="none" stroke="#333" stroke-width="1.5"/>
    <line x1="40" y1="40" x2="40" y2="100" stroke="#333"/>
    <line x1="55" y1="70" x2="90" y2="70" stroke="#b83a3a" stroke-width="2"/>
    <polygon points="40,70 50,66 50,74" fill="#333"/>
    <text x="100" y="74" fill="#b83a3a" font-size="12">→ PA0</text>
    <line x1="40" y1="120" x2="40" y2="130" stroke="#333" stroke-width="2"/>
    <text x="40" y="145" text-anchor="middle" font-size="11">GND</text>
    <text x="0" y="170" font-size="11" fill="#555">滑动端在 0~3.3V 间连续可调，</text>
    <text x="0" y="185" font-size="11" fill="#555">用来调试 ADC、做手动旋钮输入。</text>
  </g>

  <!-- 2. photoresistor -->
  <g transform="translate(280,50)">
    <text x="0" y="0" font-weight="bold" fill="#1a4a78">② 光敏电阻（上拉 + 分压）</text>
    <line x1="40" y1="20" x2="40" y2="40" stroke="#333" stroke-width="2"/>
    <text x="40" y="14" text-anchor="middle" font-size="11">3.3V</text>
    <!-- LDR zigzag -->
    <path d="M40,40 L30,50 L50,60 L30,70 L50,80 L40,90" fill="none" stroke="#333" stroke-width="1.5"/>
    <text x="60" y="68" font-size="11" fill="#555">LDR (GL5528)</text>
    <line x1="40" y1="90" x2="40" y2="110" stroke="#b83a3a" stroke-width="2"/>
    <circle cx="40" cy="100" r="3" fill="#b83a3a"/>
    <text x="55" y="104" fill="#b83a3a" font-size="12">→ PA0</text>
    <!-- 10K pulldown -->
    <path d="M40,110 L30,120 L50,130 L30,140 L50,150 L40,160" fill="none" stroke="#333" stroke-width="1.5"/>
    <text x="60" y="138" font-size="11" fill="#555">10KΩ 下拉</text>
    <line x1="40" y1="160" x2="40" y2="170" stroke="#333" stroke-width="2"/>
    <text x="40" y="185" text-anchor="middle" font-size="11">GND</text>
    <text x="0" y="205" font-size="11" fill="#555">亮→LDR 电阻小→分压点电压高；</text>
    <text x="0" y="220" font-size="11" fill="#555">暗→电阻大→电压低。</text>
  </g>

  <!-- 3. NTC -->
  <g transform="translate(520,50)">
    <text x="0" y="0" font-weight="bold" fill="#1a4a78">③ NTC 热敏电阻（测温）</text>
    <line x1="40" y1="20" x2="40" y2="40" stroke="#333" stroke-width="2"/>
    <text x="40" y="14" text-anchor="middle" font-size="11">3.3V</text>
    <!-- 10K fixed resistor on top -->
    <path d="M40,40 L30,50 L50,60 L30,70 L50,80 L40,90" fill="none" stroke="#333" stroke-width="1.5"/>
    <text x="60" y="68" font-size="11" fill="#555">10KΩ 固定电阻</text>
    <line x1="40" y1="90" x2="40" y2="110" stroke="#b83a3a" stroke-width="2"/>
    <circle cx="40" cy="100" r="3" fill="#b83a3a"/>
    <text x="55" y="104" fill="#b83a3a" font-size="12">→ PA0</text>
    <!-- NTC below -->
    <path d="M40,110 L30,120 L50,130 L30,140 L50,150 L40,160" fill="none" stroke="#a040a0" stroke-width="1.5"/>
    <text x="60" y="138" font-size="11" fill="#a040a0">NTC 10K (B=3950)</text>
    <line x1="40" y1="160" x2="40" y2="170" stroke="#333" stroke-width="2"/>
    <text x="40" y="185" text-anchor="middle" font-size="11">GND</text>
    <text x="0" y="205" font-size="11" fill="#555">温度升→NTC 电阻降→分压点电压升；</text>
    <text x="0" y="220" font-size="11" fill="#555">用 Beta 公式反算温度。</text>
  </g>

  <text x="40" y="310" font-size="12" fill="#333">通用分压公式：V_out = V_cc × R_down / (R_up + R_down)。</text>
  <text x="40" y="330" font-size="12" fill="#333">选上下拉电阻的经验值：让被测电阻在量程中点时与另一臂阻值接近，这样线性区最宽、灵敏度最高。</text>
  <text x="40" y="350" font-size="12" fill="#666">注意：ADC 输入阻抗不是无穷大，源阻抗过高会拖慢采样电容充电，必要时在引脚前加 100nF 滤波电容或提高采样时间。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif">
  <text x="440" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">定时器中断与主循环的时间关系：ISR 只做标记，主循环干活</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- time axis -->
  <line x1="60" y1="70" x2="840" y2="70" stroke="#374151" stroke-width="1.5"/>
  <text x="40" y="75" font-size="12" fill="#374151">时间</text>
  <g font-size="11" fill="#4b5563">
    <line x1="120" y1="65" x2="120" y2="75" stroke="#374151"/>
    <text x="120" y="60" text-anchor="middle">0ms</text>
    <line x1="240" y1="65" x2="240" y2="75" stroke="#374151"/>
    <text x="240" y="60" text-anchor="middle">10ms</text>
    <line x1="360" y1="65" x2="360" y2="75" stroke="#374151"/>
    <text x="360" y="60" text-anchor="middle">20ms</text>
    <line x1="480" y1="65" x2="480" y2="75" stroke="#374151"/>
    <text x="480" y="60" text-anchor="middle">30ms</text>
    <line x1="600" y1="65" x2="600" y2="75" stroke="#374151"/>
    <text x="600" y="60" text-anchor="middle">40ms</text>
    <line x1="720" y1="65" x2="720" y2="75" stroke="#374151"/>
    <text x="720" y="60" text-anchor="middle">50ms</text>
  </g>

  <!-- main loop bar -->
  <rect x="60" y="100" width="780" height="50" fill="#e5e7eb" stroke="#6b7280"/>
  <text x="450" y="125" text-anchor="middle" font-size="13" fill="#1f2937">主循环 while(1)：扫描按键、刷新显示、处理协议……</text>
  <text x="450" y="143" text-anchor="middle" font-size="11" fill="#4b5563">看到 flag_tick_1ms = 1 时才做周期动作，否则继续别的任务</text>

  <!-- ISR bursts -->
  <g>
    <rect x="115" y="170" width="10" height="40" fill="#93c5fd" stroke="#1d4ed8"/>
    <rect x="235" y="170" width="10" height="40" fill="#93c5fd" stroke="#1d4ed8"/>
    <rect x="355" y="170" width="10" height="40" fill="#93c5fd" stroke="#1d4ed8"/>
    <rect x="475" y="170" width="10" height="40" fill="#93c5fd" stroke="#1d4ed8"/>
    <rect x="595" y="170" width="10" height="40" fill="#93c5fd" stroke="#1d4ed8"/>
    <rect x="715" y="170" width="10" height="40" fill="#93c5fd" stroke="#1d4ed8"/>
  </g>
  <text x="780" y="195" font-size="12" fill="#1d4ed8" font-weight="bold">ISR：几微秒就退出</text>

  <!-- ISR content -->
  <rect x="60" y="240" width="780" height="90" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="80" y="265" font-size="13" font-weight="bold" fill="#1f2937">ISR 里只做三件事（推荐写法）：</text>
  <text x="100" y="290" font-size="12" fill="#374151">① 清中断标志（HAL 已经做）</text>
  <text x="100" y="310" font-size="12" fill="#374151">② 累加 / 翻转一个 volatile 变量</text>
  <text x="420" y="290" font-size="12" fill="#374151">③ 到点了就置一个 flag（不要在 ISR 里点灯、延时、打印）</text>
  <text x="420" y="310" font-size="12" fill="#b91c1c" font-weight="bold">千万不要在 ISR 里调用 HAL_Delay / 长循环 / printf</text>

  <!-- example code -->
  <rect x="60" y="360" width="780" height="80" fill="#0f172a" stroke="#1e293b"/>
  <text x="80" y="385" font-family="Consolas, monospace" font-size="12" fill="#a7f3d0">void HAL_TIM_PeriodElapsedCallback(...) {</text>
  <text x="100" y="405" font-family="Consolas, monospace" font-size="12" fill="#e2e8f0">tick_10ms++;</text>
  <text x="100" y="423" font-family="Consolas, monospace" font-size="12" fill="#e2e8f0">if (tick_10ms &gt;= 100) { tick_10ms = 0; flag_1s = 1; }</text>
  <text x="80" y="438" font-family="Consolas, monospace" font-size="12" fill="#a7f3d0">}</text>
</svg>

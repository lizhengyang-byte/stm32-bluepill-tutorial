<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="460" fill="#fafbfc"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">STM32 开发"生产线"：谁生成代码、谁编译、谁烧录</text>

  <!-- Stage 1 CubeMX -->
  <rect x="40" y="70" width="180" height="120" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="130" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">STM32CubeMX</text>
  <text x="130" y="120" text-anchor="middle" font-size="11" fill="#14532d">图形化勾选外设</text>
  <text x="130" y="138" text-anchor="middle" font-size="11" fill="#14532d">配时钟树 / 引脚</text>
  <text x="130" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">→ 生成 HAL 工程</text>
  <text x="130" y="180" text-anchor="middle" font-size="10.5" fill="#16a34a">三个 IDE 共用它</text>

  <!-- Stage 2 code -->
  <rect x="290" y="70" width="180" height="120" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">HAL 库 C 工程</text>
  <text x="380" y="120" text-anchor="middle" font-size="11" fill="#1e3a8a">main.c + Drivers/</text>
  <text x="380" y="138" text-anchor="middle" font-size="11" fill="#1e3a8a">你只写 USER CODE 区</text>
  <text x="380" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">→ 交给编译器</text>

  <!-- Stage 3 compiler -->
  <rect x="540" y="70" width="180" height="120" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="630" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#713f12">编译器 arm-gcc/armcc</text>
  <text x="630" y="120" text-anchor="middle" font-size="11" fill="#713f12">C → 机器码</text>
  <text x="630" y="138" text-anchor="middle" font-size="11" fill="#713f12">链接 → .elf/.hex</text>
  <text x="630" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#713f12">→ 生成烧录文件</text>

  <!-- Stage 4 flash -->
  <rect x="760" y="70" width="110" height="120" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="815" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#831843">ST-Link</text>
  <text x="815" y="128" text-anchor="middle" font-size="11" fill="#831843">SWD 烧录</text>
  <text x="815" y="148" text-anchor="middle" font-size="11" fill="#831843">进芯片 Flash</text>
  <text x="815" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#831843">→ 运行</text>

  <line x1="220" y1="130" x2="290" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="470" y1="130" x2="540" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="720" y1="130" x2="760" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#555"/></marker></defs>

  <!-- three IDEs -->
  <text x="450" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">三个 IDE 的分工（都站在 CubeMX 肩膀上）</text>
  <rect x="60" y="275" width="240" height="150" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="180" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#312e81">Keil MDK5 (μVision)</text>
  <text x="75" y="325" font-size="11" fill="#312e81">• 编译器：armcc/armclang</text>
  <text x="75" y="345" font-size="11" fill="#312e81">• 工程：.uvprojx</text>
  <text x="75" y="365" font-size="11" fill="#312e81">• 烧录：内置 ST-Link 驱动</text>
  <text x="75" y="385" font-size="11" fill="#312e81">• 仅 Windows，收费(可试用)</text>
  <text x="75" y="408" font-size="10.5" fill="#4f46e5">教程最多，国内主流</text>

  <rect x="330" y="275" width="240" height="150" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="450" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#312e81">STM32CubeIDE</text>
  <text x="345" y="325" font-size="11" fill="#312e81">• 编译器：内置 arm-gcc</text>
  <text x="345" y="345" font-size="11" fill="#312e81">• 工程：.cproject/.project</text>
  <text x="345" y="365" font-size="11" fill="#312e81">• 内置 CubeMX，免费</text>
  <text x="345" y="385" font-size="11" fill="#312e81">• 跨平台 Win/Mac/Linux</text>
  <text x="345" y="408" font-size="10.5" fill="#4f46e5">官方亲儿子，新手友好</text>

  <rect x="600" y="275" width="240" height="150" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="720" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#312e81">VSCode + PlatformIO</text>
  <text x="615" y="325" font-size="11" fill="#312e81">• 编译器：platform 拉取 gcc</text>
  <text x="615" y="345" font-size="11" fill="#312e81">• 配置：platformio.ini</text>
  <text x="615" y="365" font-size="11" fill="#312e81">• 开源、Git 友好</text>
  <text x="615" y="385" font-size="11" fill="#312e81">• 跨平台，进阶/Linux 向</text>
  <text x="615" y="408" font-size="10.5" fill="#4f46e5">第二套了解即可</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif">
  <text x="440" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">输入捕获：用定时器测外部信号的周期 / 脉宽</text>

  <!-- input signal -->
  <text x="60" y="70" font-size="13" font-weight="bold" fill="#1f2937">外部输入引脚（如超声波回波 HC-SR04）：</text>
  <line x1="60" y1="90" x2="60" y2="180" stroke="#374151" stroke-width="1.5"/>
  <line x1="60" y1="180" x2="840" y2="180" stroke="#374151" stroke-width="1.5"/>
  <text x="30" y="100" font-size="11" fill="#374151">高</text>
  <text x="30" y="185" font-size="11" fill="#374151">低</text>

  <polyline points="60,175 200,175 200,100 500,100 500,175 840,175" fill="none" stroke="#1e40af" stroke-width="2"/>

  <!-- capture points -->
  <line x1="200" y1="90" x2="200" y2="200" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="500" y1="90" x2="500" y2="200" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="200" y="220" text-anchor="middle" font-size="12" fill="#b91c1c" font-weight="bold">捕获点 1：上升沿</text>
  <text x="500" y="220" text-anchor="middle" font-size="12" fill="#b91c1c" font-weight="bold">捕获点 2：下降沿</text>

  <!-- CNT -->
  <text x="60" y="270" font-size="13" font-weight="bold" fill="#1f2937">此时定时器 CNT 的值：</text>
  <rect x="60" y="290" width="360" height="50" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="240" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">CCR1 = CNT 值（上升沿时刻）</text>
  <rect x="460" y="290" width="360" height="50" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="640" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">CCR2 = CNT 值（下降沿时刻）</text>

  <!-- result -->
  <rect x="60" y="360" width="780" height="60" fill="#d1fae5" stroke="#047857"/>
  <text x="450" y="385" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">脉宽时间 = (CCR2 − CCR1) × (PSC+1) / 时钟频率</text>
  <text x="450" y="407" text-anchor="middle" font-size="12" fill="#047857">例：超声波高电平 1500µs → 距离 = 1500 × 0.17 mm ≈ 25.5 cm</text>
</svg>

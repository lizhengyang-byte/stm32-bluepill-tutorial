<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Helvetica, Arial, 'Microsoft YaHei', sans-serif">
  <text x="440" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">SysTick：Cortex-M 内核自带的 24 位递减定时器</text>

  <!-- clock source -->
  <rect x="60" y="80" width="160" height="50" fill="#dbeafe" stroke="#1e40af"/>
  <text x="140" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">内核时钟 HCLK</text>
  <text x="140" y="122" text-anchor="middle" font-size="11" fill="#1e3a8a">72 MHz（或 8 分频）</text>

  <!-- reload -->
  <rect x="280" y="80" width="180" height="50" fill="#fef3c7" stroke="#b45309"/>
  <text x="370" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">LOAD 重装载寄存器</text>
  <text x="370" y="122" text-anchor="middle" font-size="11" fill="#92400e">= 71999（对应 1ms）</text>

  <!-- current -->
  <rect x="530" y="80" width="180" height="50" fill="#d1fae5" stroke="#047857"/>
  <text x="620" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">CURRENT 计数器</text>
  <text x="620" y="122" text-anchor="middle" font-size="11" fill="#065f46">每个时钟 −1</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <line x1="220" y1="105" x2="280" y2="105" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="460" y1="105" x2="530" y2="105" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- countdown bar -->
  <text x="60" y="190" font-size="14" font-weight="bold" fill="#1f2937">计数过程（向下计数到 0）：</text>
  <rect x="80" y="210" width="640" height="20" fill="#e5e7eb" stroke="#6b7280"/>
  <rect x="80" y="210" width="640" height="20" fill="#93c5fd"/>
  <text x="400" y="225" text-anchor="middle" font-size="12" fill="#1e3a8a">CURRENT：71999 → 71998 → … → 1 → 0</text>

  <!-- interrupt arrow -->
  <line x1="720" y1="220" x2="780" y2="280" stroke="#b91c1c" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="700" y="280" width="160" height="50" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="780" y="302" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">SysTick 中断</text>
  <text x="780" y="320" text-anchor="middle" font-size="11" fill="#7f1d1d">uwTick++  → 自动重装 LOAD</text>

  <!-- HAL_Delay -->
  <rect x="80" y="280" width="560" height="50" fill="#f3f4f6" stroke="#374151"/>
  <text x="360" y="302" text-anchor="middle" font-size="13" fill="#1f2937">HAL_Delay(ms)：while (HAL_GetTick() - start &lt; ms);  忙等</text>
  <text x="360" y="320" text-anchor="middle" font-size="11" fill="#4b5563">HAL_GetTick() 返回 uwTick（毫秒数）</text>

  <!-- note -->
  <text x="60" y="380" font-size="13" fill="#1f2937">
    <tspan font-weight="bold">为什么是 71999？</tspan>
    72 MHz ÷ (71999 + 1) = 1 kHz → 每 1ms 触发一次 SysTick 中断。
  </text>
  <text x="60" y="405" font-size="13" fill="#1f2937">
    <tspan font-weight="bold">注意：</tspan>
    SysTick 是内核级外设，不挂在 APB 总线上；FreeRTOS 等 RTOS 也会占用它，所以裸机工程里别在业务里再动它。
  </text>
</svg>

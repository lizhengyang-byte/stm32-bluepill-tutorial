<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="Consolas, 'Courier New', monospace" font-size="13">
  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <style>
      .step { fill: #e8f0fe; stroke: #4a7abc; stroke-width: 1.5; rx: 8; }
      .step2 { fill: #e8f5e9; stroke: #4caf50; stroke-width: 1.5; rx: 8; }
      .step3 { fill: #fff3e0; stroke: #e8833a; stroke-width: 1.5; rx: 8; }
      .step4 { fill: #fce4ec; stroke: #c62828; stroke-width: 1.5; rx: 8; }
      .lbl { fill: #222; font-size: 13px; text-anchor: middle; }
      .sub { fill: #555; font-size: 11px; text-anchor: middle; }
      .addr { fill: #c62828; font-weight: bold; }
      .ln { stroke: #333; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">STM32 上电启动流程（Reset → main）</text>

  <!-- Step 1 -->
  <rect x="250" y="55" width="300" height="55" class="step4"/>
  <text x="400" y="78" class="lbl" font-weight="bold">① 上电 / 复位</text>
  <text x="400" y="98" class="sub">电源稳定后，芯片释放复位信号</text>

  <line x1="400" y1="110" x2="400" y2="135" class="ln" marker-end="url(#arr2)"/>

  <!-- Step 2 -->
  <rect x="220" y="135" width="360" height="70" class="step"/>
  <text x="400" y="158" class="lbl" font-weight="bold">② 从 0x08000000 取向量表</text>
  <text x="400" y="178" class="sub addr">地址 0x08000000 → MSP 栈顶地址</text>
  <text x="400" y="195" class="sub">地址 0x08000004 → Reset_Handler 入口地址</text>

  <line x1="400" y1="205" x2="400" y2="230" class="ln" marker-end="url(#arr2)"/>

  <!-- Step 3 -->
  <rect x="220" y="230" width="360" height="70" class="step"/>
  <text x="400" y="253" class="lbl" font-weight="bold">③ 执行 Reset_Handler（startup_stm32f1xx.s）</text>
  <text x="400" y="273" class="sub">复制 .data 段到 SRAM · 清零 .bss 段</text>
  <text x="400" y="290" class="sub">调用 SystemInit() → 调用 __main</text>

  <line x1="400" y1="300" x2="400" y2="325" class="ln" marker-end="url(#arr2)"/>

  <!-- Step 4 -->
  <rect x="220" y="325" width="360" height="65" class="step3"/>
  <text x="400" y="348" class="lbl" font-weight="bold">④ SystemInit() 时钟配置</text>
  <text x="400" y="368" class="sub">设置 PLL → 切 SYSCLK 到 72MHz</text>
  <text x="400" y="383" class="sub">配置 Flash 等待周期 / AHB / APB 分频</text>

  <line x1="400" y1="390" x2="400" y2="415" class="ln" marker-end="url(#arr2)"/>

  <!-- Step 5 -->
  <rect x="220" y="415" width="360" height="65" class="step2"/>
  <text x="400" y="438" class="lbl" font-weight="bold">⑤ __main → main() 入口</text>
  <text x="400" y="458" class="sub">C 库初始化完成，进入用户代码</text>
  <text x="400" y="473" class="sub">HAL_Init() · SystemClock_Config() · MX_GPIO_Init()</text>

  <line x1="400" y1="480" x2="400" y2="505" class="ln" marker-end="url(#arr2)"/>

  <!-- Step 6 -->
  <rect x="250" y="505" width="300" height="55" class="step2"/>
  <text x="400" y="528" class="lbl" font-weight="bold">⑥ while(1) 主循环</text>
  <text x="400" y="548" class="sub">用户业务代码开始执行</text>

  <!-- Side notes -->
  <rect x="60" y="135" width="130" height="70" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4"/>
  <text x="125" y="158" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">向量表</text>
  <text x="125" y="176" text-anchor="middle" font-size="10" fill="#888">放在 Flash 起始处</text>
  <text x="125" y="192" text-anchor="middle" font-size="10" fill="#888">每项 4 字节</text>

  <rect x="610" y="230" width="150" height="70" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4"/>
  <text x="685" y="253" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">startup 文件</text>
  <text x="685" y="271" text-anchor="middle" font-size="10" fill="#888">由 CubeMX 自动生成</text>
  <text x="685" y="287" text-anchor="middle" font-size="10" fill="#888">汇编语言编写</text>
</svg>

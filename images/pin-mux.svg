<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="420" fill="#fafbfc"/>
  <text x="410" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">一个引脚为什么能同时是串口、PWM 和普通 IO</text>

  <!-- physical pin -->
  <rect x="360" y="70" width="100" height="60" rx="6" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <text x="410" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">物理引脚</text>
  <text x="410" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">PA9</text>

  <!-- multiplexer -->
  <polygon points="370,180 450,180 430,260 390,260" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="410" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#713f12">复用开关</text>
  <text x="410" y="233" text-anchor="middle" font-size="10.5" fill="#713f12">(AF 选择器)</text>
  <line x1="410" y1="130" x2="410" y2="180" stroke="#555" stroke-width="2"/>

  <!-- options -->
  <rect x="80" y="300" width="150" height="70" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="155" y="328" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">普通 GPIO 输出/输入</text>
  <text x="155" y="348" text-anchor="middle" font-size="11" fill="#1e3a8a">自己读写电平</text>

  <rect x="285" y="300" width="150" height="70" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="360" y="328" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">USART1_TX 串口发</text>
  <text x="360" y="348" text-anchor="middle" font-size="11" fill="#14532d">交给串口外设</text>

  <rect x="490" y="300" width="150" height="70" rx="5" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="565" y="328" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#831843">TIM1_CH2 定时器</text>
  <text x="565" y="348" text-anchor="middle" font-size="11" fill="#831843">可输出 PWM</text>

  <rect x="660" y="300" width="130" height="70" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="725" y="328" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c2d12">其他复用功能</text>
  <text x="725" y="348" text-anchor="middle" font-size="11" fill="#7c2d12">重映射后可选</text>

  <line x1="400" y1="260" x2="155" y2="300" stroke="#999" stroke-width="1.2"/>
  <line x1="408" y1="260" x2="360" y2="300" stroke="#999" stroke-width="1.2"/>
  <line x1="420" y1="260" x2="565" y2="300" stroke="#999" stroke-width="1.2"/>
  <line x1="425" y1="260" x2="725" y2="300" stroke="#999" stroke-width="1.2"/>

  <text x="410" y="400" text-anchor="middle" font-size="12" fill="#666">同一时刻只能选一个功能；CubeMX 里点引脚选功能，本质就是在配这个"开关"</text>
</svg>

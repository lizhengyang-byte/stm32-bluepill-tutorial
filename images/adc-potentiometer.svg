<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Arial, sans-serif">
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold">ADC 电位器分压电路与转换原理</text>

  <!-- Potentiometer triangle -->
  <!-- 3.3V rail -->
  <line x1="200" y1="100" x2="200" y2="130" stroke="#c0392b" stroke-width="2.5"/>
  <text x="180" y="95" text-anchor="middle" font-size="14" fill="#c0392b" font-weight="bold">3.3V</text>

  <!-- Potentiometer body (triangle) -->
  <polygon points="200,130 140,250 260,250" fill="#ecf0f1" stroke="#2c3e50" stroke-width="2"/>
  <text x="200" y="200" text-anchor="middle" font-size="13" fill="#2c3e50">电位器</text>
  <text x="200" y="218" text-anchor="middle" font-size="12" fill="#7f8c8d">10K 3296W</text>

  <!-- Wiper arrow -->
  <line x1="200" y1="250" x2="200" y2="300" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <defs><marker id="arrowG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/></marker></defs>
  <text x="220" y="280" font-size="12" fill="#27ae60">滑动端(中间脚)</text>

  <!-- GND rail -->
  <line x1="200" y1="250" x2="200" y2="340" stroke="#7f8c8d" stroke-width="2.5"/>
  <line x1="170" y1="340" x2="230" y2="340" stroke="#7f8c8d" stroke-width="2.5"/>
  <line x1="180" y1="350" x2="220" y2="350" stroke="#7f8c8d" stroke-width="2"/>
  <line x1="190" y1="360" x2="210" y2="360" stroke="#7f8c8d" stroke-width="2"/>
  <text x="200" y="380" text-anchor="middle" font-size="14" fill="#7f8c8d" font-weight="bold">GND</text>

  <!-- Wire from wiper to ADC pin -->
  <path d="M200,300 L350,300 L350,200" stroke="#27ae60" stroke-width="2.5" fill="none"/>
  <circle cx="200" cy="300" r="4" fill="#27ae60"/>

  <!-- STM32 ADC box -->
  <rect x="350" y="140" width="200" height="120" rx="8" fill="#e8f4fd" stroke="#2980b9" stroke-width="2"/>
  <text x="450" y="165" text-anchor="middle" font-size="15" font-weight="bold" fill="#2980b9">STM32 ADC1</text>
  <rect x="350" y="180" width="55" height="25" rx="3" fill="#27ae60"/>
  <text x="377" y="197" text-anchor="middle" font-size="12" fill="white" font-weight="bold">PA0</text>
  <text x="430" y="197" font-size="12" fill="#555">ADC1_IN0</text>
  <text x="450" y="225" text-anchor="middle" font-size="12" fill="#7f8c8d">12 位分辨率</text>
  <text x="450" y="245" text-anchor="middle" font-size="12" fill="#7f8c8d">参考电压 VREF = 3.3V</text>

  <!-- Formula box -->
  <rect x="580" y="140" width="200" height="120" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <text x="680" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#f39c12">转换公式</text>
  <text x="680" y="195" text-anchor="middle" font-size="13" fill="#2c3e50">数字值 = V / 3.3V × 4095</text>
  <text x="680" y="220" text-anchor="middle" font-size="12" fill="#7f8c8d">0 ~ 4095 ↔ 0 ~ 3.3V</text>
  <text x="680" y="242" text-anchor="middle" font-size="12" fill="#27ae60">例: 1.65V → 2047</text>

  <!-- Scale bar visualization -->
  <rect x="100" y="410" width="600" height="30" rx="4" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db"/>
      <stop offset="100%" style="stop-color:#e74c3c"/>
    </linearGradient>
  </defs>
  <text x="100" y="405" font-size="11" fill="#3498db">0V (0)</text>
  <text x="400" y="405" text-anchor="middle" font-size="11" fill="#555">1.65V (2047)</text>
  <text x="700" y="405" text-anchor="end" font-size="11" fill="#e74c3c">3.3V (4095)</text>
  <text x="400" y="465" text-anchor="middle" font-size="12" fill="#7f8c8d">转动电位器 → 输出电压在 0~3.3V 之间连续变化 → ADC 输出 0~4095</text>
</svg>

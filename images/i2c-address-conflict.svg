<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="800" height="380" fill="#fafbfc"/>
  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold">I2C 多设备：总线共享，但地址不能撞</text>

  <!-- MCU -->
  <rect x="320" y="60" width="160" height="60" fill="#2c5aa0" rx="6"/>
  <text x="400" y="95" text-anchor="middle" fill="#fff" font-weight="bold">STM32 (主机)</text>

  <!-- Bus lines -->
  <line x1="400" y1="120" x2="400" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="120" y1="160" x2="680" y2="160" stroke="#333" stroke-width="2"/>
  <text x="690" y="165" font-weight="bold">SDA</text>
  <line x1="120" y1="180" x2="680" y2="180" stroke="#666" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="690" y="185" font-weight="bold" fill="#666">SCL</text>

  <!-- Pull-up resistor -->
  <line x1="200" y1="160" x2="200" y2="130" stroke="#333" stroke-width="2"/>
  <rect x="190" y="110" width="20" height="20" fill="#fff" stroke="#333"/>
  <text x="215" y="125" font-size="11">4.7kΩ</text>
  <text x="215" y="140" font-size="11" fill="#666">上拉到 3.3V</text>

  <!-- Device A: OLED 0x3C -->
  <rect x="80" y="220" width="160" height="70" fill="#fff" stroke="#2c5aa0" stroke-width="2" rx="6"/>
  <text x="160" y="245" text-anchor="middle" font-weight="bold">OLED (SSD1306)</text>
  <text x="160" y="265" text-anchor="middle" font-size="12" fill="#2c5aa0">7 位地址 0x3C</text>
  <text x="160" y="282" text-anchor="middle" font-size="11" fill="#888">ADDR 引脚悬空</text>
  <line x1="160" y1="220" x2="160" y2="180" stroke="#333" stroke-width="1.5"/>
  <line x1="160" y1="220" x2="160" y2="160" stroke="#333" stroke-width="1.5"/>

  <!-- Device B: BMP280 0x76 -->
  <rect x="320" y="220" width="160" height="70" fill="#fff" stroke="#2c7a2c" stroke-width="2" rx="6"/>
  <text x="400" y="245" text-anchor="middle" font-weight="bold">BMP280 气压计</text>
  <text x="400" y="265" text-anchor="middle" font-size="12" fill="#2c7a2c">7 位地址 0x76</text>
  <text x="400" y="282" text-anchor="middle" font-size="11" fill="#888">SDO 接 GND</text>
  <line x1="400" y1="220" x2="400" y2="180" stroke="#333" stroke-width="1.5"/>
  <line x1="400" y1="220" x2="400" y2="160" stroke="#333" stroke-width="1.5"/>

  <!-- Device C: conflict -->
  <rect x="560" y="220" width="160" height="70" fill="#fff" stroke="#a02c2c" stroke-width="2" rx="6"/>
  <text x="640" y="245" text-anchor="middle" font-weight="bold">第二块 OLED</text>
  <text x="640" y="265" text-anchor="middle" font-size="12" fill="#a02c2c">地址也是 0x3C</text>
  <text x="640" y="282" text-anchor="middle" font-size="11" fill="#a02c2c">和左边撞了！</text>
  <line x1="640" y1="220" x2="640" y2="180" stroke="#a02c2c" stroke-width="1.5"/>
  <line x1="640" y1="220" x2="640" y2="160" stroke="#a02c2c" stroke-width="1.5"/>

  <!-- Annotation -->
  <rect x="80" y="315" width="640" height="50" fill="#fff5f5" stroke="#a02c2c" rx="6"/>
  <text x="400" y="337" text-anchor="middle" font-size="12">主机发 0x3C 时，两块 OLED 都会应答，数据互相踩——表现为屏幕花屏、时好时坏。</text>
  <text x="400" y="355" text-anchor="middle" font-size="12" fill="#a02c2c">解法：换一块地址可配的 OLED（ADDR 拉高变 0x3D），或者用 I2C 多路复用器（TCA9548A）。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360">
  <style>
    .t{font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1a1a1a}
    .cell{stroke:#2d3748;stroke-width:1.5}
    .lbl{font-size:13px}
    .small{font-size:11px;fill:#555}
  </style>
  <rect x="0" y="0" width="800" height="360" fill="#ffffff"/>
  <text x="400" y="28" text-anchor="middle" class="t" font-size="17" font-weight="bold">环形缓冲（Ring Buffer）：中断写、主循环读，互不打架</text>

  <!-- buffer cells 16 slots -->
  <g>
    <rect x="120" y="90" width="40" height="40" class="cell" fill="#fed7d7"/><text x="140" y="114" text-anchor="middle" class="t small">A</text>
    <rect x="160" y="90" width="40" height="40" class="cell" fill="#bee3f8"/><text x="180" y="114" text-anchor="middle" class="t small">B</text>
    <rect x="200" y="90" width="40" height="40" class="cell" fill="#bee3f8"/><text x="220" y="114" text-anchor="middle" class="t small">C</text>
    <rect x="240" y="90" width="40" height="40" class="cell" fill="#bee3f8"/><text x="260" y="114" text-anchor="middle" class="t small">D</text>
    <rect x="280" y="90" width="40" height="40" class="cell" fill="#e2e8f0"/><text x="300" y="114" text-anchor="middle" class="t small">·</text>
    <rect x="320" y="90" width="40" height="40" class="cell" fill="#e2e8f0"/><text x="340" y="114" text-anchor="middle" class="t small">·</text>
    <rect x="360" y="90" width="40" height="40" class="cell" fill="#e2e8f0"/><text x="380" y="114" text-anchor="middle" class="t small">·</text>
    <rect x="400" y="90" width="40" height="40" class="cell" fill="#e2e8f0"/><text x="420" y="114" text-anchor="middle" class="t small">·</text>
    <rect x="440" y="90" width="40" height="40" class="cell" fill="#e2e8f0"/><text x="460" y="114" text-anchor="middle" class="t small">·</text>
    <rect x="480" y="90" width="40" height="40" class="cell" fill="#c6f6d5"/><text x="500" y="114" text-anchor="middle" class="t small">X</text>
    <rect x="520" y="90" width="40" height="40" class="cell" fill="#e2e8f0"/><text x="540" y="114" text-anchor="middle" class="t small">·</text>
    <rect x="560" y="90" width="40" height="40" class="cell" fill="#e2e8f0"/><text x="580" y="114" text-anchor="middle" class="t small">·</text>
    <rect x="600" y="90" width="40" height="40" class="cell" fill="#e2e8f0"/><text x="620" y="114" text-anchor="middle" class="t small">·</text>
    <rect x="640" y="90" width="40" height="40" class="cell" fill="#e2e8f0"/><text x="660" y="114" text-anchor="middle" class="t small">·</text>
  </g>

  <!-- write pointer -->
  <line x1="300" y1="130" x2="300" y2="160" stroke="#c53030" stroke-width="2" marker-end="url(#a4)"/>
  <text x="300" y="180" text-anchor="middle" class="t small" fill="#c53030" font-weight="bold">write_idx（中断写）</text>
  <!-- read pointer -->
  <line x1="140" y1="90" x2="140" y2="60" stroke="#2f855a" stroke-width="2" marker-end="url(#a4)"/>
  <text x="140" y="50" text-anchor="middle" class="t small" fill="#2f855a" font-weight="bold">read_idx（主循环读）</text>

  <!-- wrap arrow -->
  <path d="M660,110 Q720,110 720,110 Q720,140 680,150 Q200,170 160,130" fill="none" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#a4)"/>
  <text x="720" y="180" class="t small" fill="#a0aec0">到头绕回开头</text>

  <defs><marker id="a4" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#4a5568"/></marker></defs>

  <g class="t small">
    <text x="120" y="230">• 串口中断每收到 1 字节 → 存到 buf[write_idx]，write_idx 自增并对长度取模。</text>
    <text x="120" y="252">• 主循环空闲时看 read_idx != write_idx，说明有新数据，取出来处理，read_idx 自增。</text>
    <text x="120" y="274">• 两个指针各自独立，中断只动 write_idx，主循环只动 read_idx，天然解耦，不丢字节。</text>
    <text x="120" y="305">• 这就是 STM32 接收不定长串口指令、ESC 飞控、传感器数据流的标准做法；DMA + 空闲中断是它的硬件加速版。</text>
  </g>
</svg>

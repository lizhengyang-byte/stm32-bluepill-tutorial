<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <style>
    .t{font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1a1a1a}
    .lbl{font-size:13px}
    .small{font-size:11px;fill:#666}
    .sig{fill:none;stroke-linejoin:round;stroke-linecap:round}
  </style>
  <rect x="0" y="0" width="800" height="420" fill="#ffffff"/>
  <text x="400" y="28" text-anchor="middle" class="t" font-size="17" font-weight="bold">SG90 舵机：20ms 周期内高电平脉宽决定角度</text>

  <!-- 0deg: 0.5ms pulse -->
  <text x="30" y="80" class="t lbl" font-weight="bold">0°</text>
  <line x1="80" y1="90" x2="760" y2="90" stroke="#e0e0e0" stroke-width="1"/>
  <path class="sig" d="M80,105 L100,105 L100,60 L130,60 L130,105 L760,105" stroke="#2b6cb0" stroke-width="2.5"/>
  <text x="115" y="52" text-anchor="middle" class="t small">0.5ms</text>
  <text x="430" y="120" text-anchor="middle" class="t small">周期 20ms (50Hz)</text>

  <!-- 90deg: 1.5ms pulse -->
  <text x="30" y="190" class="t lbl" font-weight="bold">90°</text>
  <line x1="80" y1="200" x2="760" y2="200" stroke="#e0e0e0" stroke-width="1"/>
  <path class="sig" d="M80,215 L100,215 L100,170 L220,170 L220,215 L760,215" stroke="#2f855a" stroke-width="2.5"/>
  <text x="160" y="162" text-anchor="middle" class="t small">1.5ms</text>

  <!-- 180deg: 2.5ms pulse -->
  <text x="30" y="300" class="t lbl" font-weight="bold">180°</text>
  <line x1="80" y1="310" x2="760" y2="310" stroke="#e0e0e0" stroke-width="1"/>
  <path class="sig" d="M80,325 L100,325 L100,280 L310,280 L310,325 L760,325" stroke="#c53030" stroke-width="2.5"/>
  <text x="205" y="272" text-anchor="middle" class="t small">2.5ms</text>

  <!-- axis -->
  <line x1="80" y1="360" x2="760" y2="360" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#333"/></marker></defs>
  <text x="80" y="380" text-anchor="middle" class="t small">0</text>
  <text x="310" y="380" text-anchor="middle" class="t small">2.5ms</text>
  <text x="760" y="380" text-anchor="end" class="t small">20ms</text>
  <text x="420" y="405" text-anchor="middle" class="t small">同一周期下，高电平越宽 → 角度越大；脉宽超出 0.5~2.5ms 范围会堵转或抖动</text>
</svg>

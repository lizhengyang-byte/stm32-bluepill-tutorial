<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Helvetica,Arial,sans-serif" font-size="13">
  <rect width="760" height="420" fill="#fafbfc"/>
  <text x="380" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">STM32F103 DMA1 通道映射表（摘自 RM0008）</text>
  <text x="380" y="42" text-anchor="middle" font-size="11" fill="#666">每个通道一次只能选一个外设请求；同一外设的 TX/RX 通常固定在不同通道</text>

  <g font-size="12">
    <rect x="40" y="55" width="680" height="28" fill="#3a78b8"/>
    <text x="60" y="74" fill="#fff" font-weight="bold">通道</text>
    <text x="150" y="74" fill="#fff" font-weight="bold">可挂的外设请求（多选一）</text>

    <rect x="40" y="83" width="680" height="40" fill="#ffe9c2" stroke="#ccc"/>
    <text x="60" y="108" font-weight="bold" fill="#a05a00">CH1</text>
    <text x="150" y="108">ADC1</text>

    <rect x="40" y="123" width="680" height="40" fill="#fff" stroke="#ccc"/>
    <text x="60" y="148" font-weight="bold" fill="#1a4a78">CH2</text>
    <text x="150" y="148">USART3_TX　·　TIM1_CH1　·　TIM2_UP　·　TIM3_CH1</text>

    <rect x="40" y="163" width="680" height="40" fill="#eef5fb" stroke="#ccc"/>
    <text x="60" y="188" font-weight="bold" fill="#1a4a78">CH3</text>
    <text x="150" y="188">USART3_RX　·　TIM1_CH2　·　TIM2_CH3　·　TIM3_UP</text>

    <rect x="40" y="203" width="680" height="40" fill="#d8f0d0" stroke="#3a883a"/>
    <text x="60" y="228" font-weight="bold" fill="#1f5a1f">CH4</text>
    <text x="150" y="228">USART1_TX　·　TIM1_ETR / TIM1_CH4　·　TIM2_CH1　·　TIM4_CH4</text>

    <rect x="40" y="243" width="680" height="40" fill="#d8f0d0" stroke="#3a883a"/>
    <text x="60" y="268" font-weight="bold" fill="#1f5a1f">CH5</text>
    <text x="150" y="268">USART1_RX　·　TIM1_CH3　·　TIM2_CH2　·　TIM4_CH1</text>

    <rect x="40" y="283" width="680" height="40" fill="#fff" stroke="#ccc"/>
    <text x="60" y="308" font-weight="bold" fill="#1a4a78">CH6</text>
    <text x="150" y="308">USART2_RX　·　TIM1_CH3　·　TIM2_UP　·　TIM3_CH3</text>

    <rect x="40" y="323" width="680" height="40" fill="#eef5fb" stroke="#ccc"/>
    <text x="60" y="348" font-weight="bold" fill="#1a4a78">CH7</text>
    <text x="150" y="348">USART2_TX　·　TIM1_CH4 / TIM1_TRIG / TIM1_COM　·　TIM2_CH4　·　TIM3_CH4 / TIM3_TRIG</text>
  </g>

  <text x="40" y="385" font-size="11" fill="#555">经验：USART1_RX 永远走 DMA1_CH5，USART1_TX 永远走 DMA1_CH4，ADC1 永远走 DMA1_CH1——</text>
  <text x="40" y="402" font-size="11" fill="#555">CubeMX 会自动绑定，你不用手选；但如果你同时挂了多个外设到同一通道，CubeMX 会红字报错。</text>
</svg>

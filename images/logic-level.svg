<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="Consolas, 'Courier New', monospace" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <style>
      .title { font-size: 18px; font-weight: bold; fill: #1a1a1a; }
      .sub { font-size: 12px; fill: #555; }
      .axis { stroke: #333; stroke-width: 1.5; }
      .grid { stroke: #ddd; stroke-width: 1; stroke-dasharray: 3,3; }
      .wav-hi { stroke: #c62828; stroke-width: 2.5; fill: none; }
      .wav-lo { stroke: #1a5fb4; stroke-width: 2.5; fill: none; }
      .lbl { font-size: 13px; fill: #222; }
      .lbl-hi { font-size: 13px; fill: #c62828; font-weight: bold; }
      .lbl-lo { font-size: 13px; fill: #1a5fb4; font-weight: bold; }
      .note { font-size: 12px; fill: #444; }
      .box { fill: #fff8e1; stroke: #e67e22; stroke-width: 1.5; rx: 5; }
    </style>
  </defs>

  <text x="430" y="28" text-anchor="middle" class="title">STM32F103 数字引脚的逻辑电平（3.3V 供电）</text>
  <text x="430" y="48" text-anchor="middle" class="sub">GPIO 没有"模拟电压"，只有两个被硬件判定的离散状态：高电平=逻辑1，低电平=逻辑0</text>

  <!-- Y axis voltage -->
  <line x1="80" y1="80" x2="80" y2="280" class="axis"/>
  <line x1="80" y1="280" x2="780" y2="280" class="axis"/>
  <text x="60" y="90" class="lbl">V</text>

  <!-- voltage grid lines -->
  <line x1="80" y1="100" x2="780" y2="100" class="grid"/>
  <text x="50" y="104" class="lbl-hi">3.3V</text>
  <line x1="80" y1="130" x2="780" y2="130" class="grid"/>
  <text x="48" y="134" class="note">2.0V</text>
  <line x1="80" y1="240" x2="780" y2="240" class="grid"/>
  <text x="48" y="244" class="note">0.8V</text>
  <line x1="80" y1="270" x2="780" y2="270" class="grid"/>
  <text x="50" y="274" class="lbl-lo">0V</text>

  <!-- waveform: high -->
  <path d="M 100 100 L 220 100 L 220 270 L 340 270 L 340 100 L 460 100 L 460 270 L 580 270 L 580 100 L 760 100" class="wav-hi"/>

  <!-- labels -->
  <text x="160" y="92" class="lbl-hi">逻辑 1（高电平）</text>
  <text x="160" y="80" class="note">输出 MOS 上管导通，引脚接 VDD</text>
  <text x="280" y="290" class="lbl-lo">逻辑 0（低电平）</text>
  <text x="280" y="306" class="note">输出 MOS 下管导通，引脚接 VSS</text>

  <!-- threshold band -->
  <rect x="600" y="130" width="180" height="110" fill="none" stroke="#999" stroke-dasharray="4,3"/>
  <text x="690" y="125" text-anchor="middle" class="note">输入判定阈值区</text>
  <text x="690" y="255" text-anchor="middle" class="note">0.8V ~ 2.0V 之间不定</text>

  <!-- bottom note -->
  <text x="80" y="340" class="note">输出高 ≈ 3.3V（不是 5V！STM32F103 是 3.3V 器件，接 5V 外设要电平转换）；输出低 ≈ 0V</text>
</svg>

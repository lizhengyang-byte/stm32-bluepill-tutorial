<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380">
  <style>
    .t{font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1a1a1a}
    .lbl{font-size:13px}
    .small{font-size:11px;fill:#555}
    .sig{fill:none;stroke-linejoin:round;stroke-linecap:round;stroke-width:2.5}
  </style>
  <rect x="0" y="0" width="800" height="380" fill="#ffffff"/>
  <text x="400" y="28" text-anchor="middle" class="t" font-size="17" font-weight="bold">TTL 电平 vs RS-232 电平：为什么 STM32 不能直接接电脑串口</text>

  <!-- TTL row -->
  <text x="40" y="90" class="t lbl" font-weight="bold">TTL (STM32)</text>
  <line x1="180" y1="120" x2="760" y2="120" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="180" y1="55" x2="760" y2="55" stroke="#e2e8f0" stroke-width="1"/>
  <text x="170" y="59" text-anchor="end" class="t small">+3.3V (逻辑1)</text>
  <text x="170" y="124" text-anchor="end" class="t small">0V (逻辑0)</text>
  <path class="sig" d="M200,120 L240,120 L240,55 L360,55 L360,120 L440,120 L440,55 L560,55 L560,120 L720,120" stroke="#2b6cb0"/>

  <!-- RS232 row -->
  <text x="40" y="220" class="t lbl" font-weight="bold">RS-232 (老电脑)</text>
  <line x1="180" y1="250" x2="760" y2="250" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="180" y1="185" x2="760" y2="185" stroke="#e2e8f0" stroke-width="1"/>
  <text x="170" y="189" text-anchor="end" class="t small">+12V (逻辑0)</text>
  <text x="170" y="254" text-anchor="end" class="t small">-12V (逻辑1)</text>
  <path class="sig" d="M200,185 L240,185 L240,250 L360,250 L360,185 L440,185 L440,250 L560,250 L560,185 L720,185" stroke="#c53030"/>

  <!-- arrow between -->
  <text x="400" y="155" text-anchor="middle" class="t small">同一帧数据，高低电平定义完全相反，且电压差 ±12V 会烧坏 3.3V 引脚</text>

  <!-- conversion -->
  <rect x="240" y="290" width="320" height="60" rx="8" fill="#fef5e7" stroke="#c05621" stroke-width="2"/>
  <text x="400" y="315" text-anchor="middle" class="t lbl" font-weight="bold">CH340 / CP2102 等 USB 转 TTL 模块</text>
  <text x="400" y="335" text-anchor="middle" class="t small">把 USB 协议 ↔ 3.3V TTL 电平双向翻译，电脑端看到的是一个 COM 口</text>
</svg>

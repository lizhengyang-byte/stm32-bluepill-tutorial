<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="Arial, sans-serif">
  <text x="350" y="28" text-anchor="middle" font-size="20" font-weight="bold">ST-Link SWD 烧录接线图</text>
  <rect x="60" y="80" width="200" height="240" rx="8" fill="#e8f4fd" stroke="#2980b9" stroke-width="2"/>
  <text x="160" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#2980b9">ST-Link V2</text>
  <text x="160" y="128" text-anchor="middle" font-size="11" fill="#7f8c8d">调试器/烧录器</text>
  <rect x="210" y="145" width="50" height="22" rx="3" fill="#8e44ad"/>
  <text x="235" y="161" text-anchor="middle" font-size="10" fill="white" font-weight="bold">SWDIO</text>
  <rect x="210" y="180" width="50" height="22" rx="3" fill="#2980b9"/>
  <text x="235" y="196" text-anchor="middle" font-size="10" fill="white" font-weight="bold">SWCLK</text>
  <rect x="210" y="215" width="50" height="22" rx="3" fill="#7f8c8d"/>
  <text x="235" y="231" text-anchor="middle" font-size="10" fill="white" font-weight="bold">GND</text>
  <rect x="210" y="250" width="50" height="22" rx="3" fill="#c0392b"/>
  <text x="235" y="266" text-anchor="middle" font-size="10" fill="white" font-weight="bold">3.3V</text>
  <rect x="440" y="80" width="200" height="240" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <text x="540" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#f39c12">Blue Pill</text>
  <text x="540" y="128" text-anchor="middle" font-size="11" fill="#7f8c8d">STM32F103C8T6</text>
  <rect x="440" y="145" width="50" height="22" rx="3" fill="#8e44ad"/>
  <text x="465" y="161" text-anchor="middle" font-size="10" fill="white" font-weight="bold">PA13</text>
  <rect x="440" y="180" width="50" height="22" rx="3" fill="#2980b9"/>
  <text x="465" y="196" text-anchor="middle" font-size="10" fill="white" font-weight="bold">PA14</text>
  <rect x="440" y="215" width="50" height="22" rx="3" fill="#7f8c8d"/>
  <text x="465" y="231" text-anchor="middle" font-size="10" fill="white" font-weight="bold">GND</text>
  <rect x="440" y="250" width="50" height="22" rx="3" fill="#c0392b"/>
  <text x="465" y="266" text-anchor="middle" font-size="10" fill="white" font-weight="bold">3.3V</text>
  <line x1="260" y1="156" x2="440" y2="156" stroke="#8e44ad" stroke-width="2.5"/>
  <text x="350" y="148" text-anchor="middle" font-size="11" fill="#8e44ad">SWDIO → PA13 (SWDIO)</text>
  <line x1="260" y1="191" x2="440" y2="191" stroke="#2980b9" stroke-width="2.5"/>
  <text x="350" y="183" text-anchor="middle" font-size="11" fill="#2980b9">SWCLK → PA14 (SWCLK)</text>
  <line x1="260" y1="226" x2="440" y2="226" stroke="#7f8c8d" stroke-width="2.5"/>
  <text x="350" y="218" text-anchor="middle" font-size="11" fill="#555">GND → GND（共地）</text>
  <line x1="260" y1="261" x2="440" y2="261" stroke="#c0392b" stroke-width="2.5"/>
  <text x="350" y="253" text-anchor="middle" font-size="11" fill="#c0392b">3.3V → 3.3V（供电，可选）</text>
  <rect x="60" y="340" width="580" height="30" rx="5" fill="#f8f9fa" stroke="#dee2e6"/>
  <text x="350" y="360" text-anchor="middle" font-size="12" fill="#495057">
    最少只需 3 根线：SWDIO + SWCLK + GND；3.3V 用于给目标板供电（板子已独立供电时可不接）
  </text>
</svg>
